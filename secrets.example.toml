# Paste into Streamlit Cloud → app → Settings → Secrets (NOT into git).
# Root-level keys become environment variables for the source scripts.
KEEPA_API_KEY = "..."
APIFY_TOKEN = "apify_api_..."      # optional: AU prices

# Google service account JSON (Cloud console → IAM → Service accounts → Keys → JSON).
# Share the GR Pipeline sheet (editor) and the Brand Approval Matrix (viewer) with client_email.
[gcp_service_account]
type = "service_account"
project_id = "..."
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "...@....iam.gserviceaccount.com"
client_id = "..."
token_uri = "https://oauth2.googleapis.com/token"
